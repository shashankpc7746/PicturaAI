<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- PicturaAI primary mark: a night painting in a carved gilt frame, crossed by a vermilion brush stroke that leaves the frame. -->
  <defs>
    <linearGradient id="pa-top" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4DC8E"/><stop offset="1" stop-color="#C9A44C"/></linearGradient>
    <linearGradient id="pa-left" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E6C76E"/><stop offset="1" stop-color="#B8933F"/></linearGradient>
    <linearGradient id="pa-right" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#8C6F2E"/><stop offset="1" stop-color="#B08E40"/></linearGradient>
    <linearGradient id="pa-bottom" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#6E5522"/><stop offset="1" stop-color="#A3823A"/></linearGradient>
    <linearGradient id="pa-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1B2F52"/><stop offset=".62" stop-color="#22405A"/><stop offset="1" stop-color="#1D3530"/></linearGradient>
    <radialGradient id="pa-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#F4DC8E" stop-opacity=".55"/><stop offset="1" stop-color="#F4DC8E" stop-opacity="0"/></radialGradient>
    <linearGradient id="pa-paint" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#C94A2A"/><stop offset=".55" stop-color="#E0613F"/><stop offset="1" stop-color="#F08A6C"/></linearGradient>
    <mask id="pa-crescent"><rect width="128" height="128" fill="#fff"/><circle cx="50.5" cy="38" r="9.6" fill="#000"/></mask>
    <clipPath id="pa-window"><rect x="25" y="25" width="78" height="78"/></clipPath>
  </defs>
  <!-- frame -->
  <rect x="3" y="3" width="122" height="122" rx="3" fill="#26221D"/>
  <polygon points="7,7 121,7 103,25 25,25" fill="url(#pa-top)"/>
  <polygon points="7,7 25,25 25,103 7,121" fill="url(#pa-left)"/>
  <polygon points="121,7 121,121 103,103 103,25" fill="url(#pa-right)"/>
  <polygon points="7,121 25,103 103,103 121,121" fill="url(#pa-bottom)"/>
  <path d="M7 7l18 18M121 7l-18 18M7 121l18-18M121 121l-18-18" stroke="#6E5522" stroke-opacity=".55" stroke-width="1"/>
  <rect x="15.5" y="15.5" width="97" height="97" fill="none" stroke="#5A4519" stroke-opacity=".5" stroke-width="1.4"/>
  <rect x="16.7" y="16.7" width="94.6" height="94.6" fill="none" stroke="#FBE7A6" stroke-opacity=".45" stroke-width=".8"/>
  <rect x="24" y="24" width="80" height="80" fill="none" stroke="#FBE7A6" stroke-width="2"/>
  <!-- the painting -->
  <g clip-path="url(#pa-window)">
    <rect x="25" y="25" width="78" height="78" fill="url(#pa-sky)"/>
    <circle cx="45" cy="42" r="20" fill="url(#pa-glow)"/>
    <circle cx="45" cy="42" r="11" fill="#F3EEE3" mask="url(#pa-crescent)"/>
    <g fill="none" stroke-linecap="round">
      <path d="M62 50c3-9 15-12 21-6 4 4 1 10-4 9-3-.6-4-3.4-2.2-5" stroke="#ECE5D6" stroke-width="2.8" stroke-opacity=".9"/>
      <path d="M69 34c6-4 15-3 19 2" stroke="#ECE5D6" stroke-width="2" stroke-opacity=".55"/>
      <path d="M33 62c7-4 15-3 20 1" stroke="#ECE5D6" stroke-width="1.8" stroke-opacity=".4"/>
    </g>
    <g fill="#F7E3A0"><path d="M92 31l1.2 2.8 2.8 1.2-2.8 1.2L92 39l-1.2-2.8L88 35l2.8-1.2z"/><circle cx="62" cy="30" r="1.3"/><circle cx="96" cy="58" r="1.1"/><circle cx="36" cy="30" r="1"/></g>
    <path d="M25 86c14-8 27-5 40-10s26-9 38-7v34H25z" fill="#16302A"/>
    <path d="M25 96c18-7 34-2 50-7 11-3.4 20-4 28-2v16H25z" fill="#24423B"/>
  </g>
  <!-- the brush stroke: shadow, body, bristle marks, highlight; its tip leaves the frame -->
  <path d="M36.6 84.6C50 75.8 62 82.6 76 75 90 67.4 101.2 50.6 122.8 40.6 108.4 58.2 95.2 77.4 79.2 86.2 63.2 95 50.8 90.6 39.6 97.8 32.4 102.6 27.2 90.2 36.6 84.6z" fill="#0E1C19" fill-opacity=".45"/>
  <path d="M34.8 81.2C48 72.4 60 79.2 74 71.6 88 64 99.2 47.2 120.8 37.2 106.4 54.8 93.2 74 77.2 82.8 61.2 91.6 48.8 87.2 37.6 94.4 30.4 99.2 25.2 86.8 34.8 81.2z" fill="url(#pa-paint)"/>
  <g fill="none" stroke-linecap="round">
    <path d="M38 89.6c10-5 21-1.6 34-8.6 9-4.8 15.6-13 24-19.6" stroke="#A93A20" stroke-width="1.3" stroke-opacity=".7"/>
    <path d="M36 85.6c11-6 22-2.4 35-9 11-5.6 19-16 30-22" stroke="#F7A487" stroke-width="1.2" stroke-opacity=".75"/>
    <path d="M42 92.4c8-3 15-1.4 24-4.8" stroke="#B9472B" stroke-width="1" stroke-opacity=".6"/>
  </g>
  <circle cx="31.6" cy="100.6" r="1.1" fill="#E0613F"/>
</svg>
