<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- PicturaAI favicon (the monogram). Designed on the Claude Design canvas "PicturaAI logo". -->
  <defs>
    <linearGradient id="pp-top" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4DC8E"/><stop offset="1" stop-color="#C9A44C"/></linearGradient>
    <linearGradient id="pp-left" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E6C76E"/><stop offset="1" stop-color="#B8933F"/></linearGradient>
    <linearGradient id="pp-right" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#8C6F2E"/><stop offset="1" stop-color="#B08E40"/></linearGradient>
    <linearGradient id="pp-bottom" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#6E5522"/><stop offset="1" stop-color="#A3823A"/></linearGradient>
    <linearGradient id="pp-paint" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#C94A2A"/><stop offset="1" stop-color="#F08A6C"/></linearGradient>
    <mask id="pp-cut"><rect width="128" height="128" fill="#fff"/><circle cx="62.5" cy="51" r="15.5" fill="#000"/></mask>
  </defs>
  <rect x="3" y="3" width="122" height="122" rx="3" fill="#26221D"/>
  <polygon points="7,7 121,7 103,25 25,25" fill="url(#pp-top)"/>
  <polygon points="7,7 25,25 25,103 7,121" fill="url(#pp-left)"/>
  <polygon points="121,7 121,121 103,103 103,25" fill="url(#pp-right)"/>
  <polygon points="7,121 25,103 103,103 121,121" fill="url(#pp-bottom)"/>
  <rect x="15.5" y="15.5" width="97" height="97" fill="none" stroke="#5A4519" stroke-opacity=".5" stroke-width="1.4"/>
  <rect x="24" y="24" width="80" height="80" fill="#1D3530" stroke="#FBE7A6" stroke-width="2"/>
  <!-- bowl of the P: a crescent moon -->
  <circle cx="66" cy="51" r="19" fill="#F3EEE3" mask="url(#pp-cut)"/>
  <!-- stem of the P: one loaded brush stroke that runs out through the bottom of the frame -->
  <path d="M47.5 30c3.2-1 6.4-.4 7.2 2.6 1 18 .6 44 1.4 66 .4 6-1.6 14-3.4 22.6-1.6-7.6-4.6-15.6-5.6-22.8C45.6 76 46 52 45.4 33.8c-.2-2 .6-3.4 2.1-3.8z" fill="url(#pp-paint)"/>
  <path d="M50.4 36c.4 18 .2 40 .8 60" stroke="#F7A487" stroke-width="1.1" stroke-opacity=".7" fill="none" stroke-linecap="round"/>
  <g fill="#F7E3A0"><circle cx="88" cy="36" r="1.4"/><circle cx="86" cy="80" r="1.2"/><circle cx="76" cy="90" r="1"/></g>
</svg>
