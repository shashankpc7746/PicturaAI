# Render Blueprint — PicturaAI
# Deploy with: https://render.com/deploy
# Or connect your GitHub repo and Render auto-detects this file.

services:
  - type: web
    name: picturaai
    runtime: docker
    plan: free
    # Cheap liveness check (no model, no disk). /api/styles still works too.
    healthCheckPath: /api/health
    envVars:
      - key: TF_CPP_MIN_LOG_LEVEL
        value: "2"
      - key: TF_ENABLE_ONEDNN_OPTS
        value: "0"
      - key: TFHUB_CACHE_DIR
        value: "/app/.tfhub_cache"
      - key: NST_MAX_DIM
        value: "320"
      - key: NST_OUTPUT_DIM
        value: "320"
      # Real visitor IP for rate limiting (Cloudflare fronts Render and overwrites it).
      # FORWARDED_ALLOW_IPS stays at its default (127.0.0.1): X-Forwarded-For is
      # client-controlled and is not used for the limits.
      - key: CLIENT_IP_HEADER
        value: "cf-connecting-ip"
      # ── Memory optimization for 512MB free tier ──
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: TF_NUM_INTRAOP_THREADS
        value: "1"
      - key: TF_NUM_INTEROP_THREADS
        value: "1"
      # ── Public site & SEO ──
      - key: PUBLIC_SITE_URL
        value: "https://picturaai-k7q6.onrender.com"
      - key: ENABLE_API_DOCS
        value: "true"
      # ── "Describe it" (Cloudflare Workers AI). Leave the two secrets unset to
      #    use keyword matching only; set their values in the Render dashboard.
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: DESCRIBE_DAILY_LIMIT
        value: "50"
      - key: RATE_LIMIT_DESCRIBE
        value: "5/minute"
      # ── Optional monitoring / analytics (leave unset to disable) ──
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_DSN_FRONTEND
        sync: false
      - key: CF_WEB_ANALYTICS_TOKEN
        sync: false
