# Render Blueprint — PicturaAI
# Deploy with: https://render.com/deploy
# Or connect your GitHub repo and Render auto-detects this file.

services:
  - type: web
    name: picturaai
    runtime: docker
    plan: free
    healthCheckPath: /api/styles
    envVars:
      - key: TF_CPP_MIN_LOG_LEVEL
        value: "2"
      - key: TF_ENABLE_ONEDNN_OPTS
        value: "0"
      - key: TFHUB_CACHE_DIR
        value: "/app/.tfhub_cache"
      - key: NST_MAX_DIM
        value: "320"
      - key: NST_OUTPUT_DIM
        value: "512"
      # ── Memory optimization for 512MB free tier ──
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: TF_NUM_INTRAOP_THREADS
        value: "1"
      - key: TF_NUM_INTEROP_THREADS
        value: "1"
